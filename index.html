<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>StrongLifts 5×5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6E9EC; --surface:#F8F9FA; --ink:#1B2027; --muted:#5C6671; --line:#D2D7DD;
  --accent:#2457C5; --accent-ink:#FFFFFF; --ok:#2E8B57; --fail:#C93A2F; --soft:#EEF1F4;
  --p25:#C93A2F; --p20:#2457C5; --p15:#E2B21E; --p10:#2E8B57; --p5:#F4F4F2; --p5b:#B9BFC6; --steel:#9AA3AD; --bar:#7D868F;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#191D22; --surface:#22272E; --ink:#EDF0F3; --muted:#98A2AD; --line:#353C45;
    --accent:#5A8AEE; --accent-ink:#0F1A2E; --ok:#4FB37C; --fail:#E5625A; --soft:#2A3038;
    --p5:#E7E8E6; --p5b:#8A929A; --bar:#69727B;
  }
}
:root[data-theme="dark"]{
  --bg:#191D22; --surface:#22272E; --ink:#EDF0F3; --muted:#98A2AD; --line:#353C45;
  --accent:#5A8AEE; --accent-ink:#0F1A2E; --ok:#4FB37C; --fail:#E5625A; --soft:#2A3038;
  --p5:#E7E8E6; --p5b:#8A929A; --bar:#69727B;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:12px 14px 120px}

nav{display:flex;gap:4px;background:var(--soft);border-radius:12px;padding:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-bottom:16px;border:1px solid var(--line)}
nav button{flex:1;border:0;background:transparent;padding:9px 0;border-radius:9px;font-weight:600;color:var(--muted)}
nav button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 2px 14px}
.head h1{font-family:var(--display);font-weight:700;font-size:44px;line-height:.95;margin:0;letter-spacing:-.5px}
.head .sub{color:var(--muted);font-size:14px;margin-top:4px}
.swap{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500;white-space:nowrap}

.lift{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 14px 16px;margin-bottom:12px}
.lift-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lift h2{font-size:17px;font-weight:600;margin:0}
.scheme{color:var(--muted);font-size:14px}
.weight{font-family:var(--display);font-weight:700;font-size:56px;line-height:1;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.weight small{font-size:24px;font-weight:600;color:var(--muted);margin-left:4px}
.hint{font-size:13px;color:var(--muted)}
.hint.warn{color:var(--fail)}

.loader{display:flex;align-items:center;height:60px;margin:8px 0 4px;gap:0}
.loader .sleeve{width:26px;height:10px;background:var(--bar);border-radius:2px 0 0 2px}
.loader .collar{width:6px;height:22px;background:var(--bar);border-radius:2px;margin-right:2px}
.loader .plate{border-radius:3px;margin-right:2px;flex:none}
.loader .end{height:10px;width:18px;background:var(--bar);border-radius:0 2px 2px 0}
.loader .empty{font-size:13px;color:var(--muted);margin-left:10px}
.perside{font-size:13px;color:var(--muted)}

.sets{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.set{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:transparent;font-family:var(--display);font-weight:700;font-size:22px;display:grid;place-items:center;color:var(--muted)}
.set.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.set.miss{background:var(--fail);border-color:var(--fail);color:#fff}
.set.tick{background:var(--ok);border-color:var(--ok);color:#fff;font-size:20px}

details.warm{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
details.warm summary{font-size:14px;color:var(--muted);cursor:pointer;list-style:none}
details.warm summary::-webkit-details-marker{display:none}
details.warm summary::before{content:"+ ";font-weight:600}
details.warm[open] summary::before{content:"− "}
.warmlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.warmlist span{background:var(--soft);border-radius:8px;padding:4px 9px;font-size:14px;font-variant-numeric:tabular-nums}

.toggle-light{margin-top:10px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px}
.toggle-light[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.extra{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.pulls{display:flex;gap:8px;margin-top:10px}
.pull{flex:1;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:4px}
.pull button{width:34px;height:34px;border:0;border-radius:9px;background:var(--soft);font-size:20px;font-weight:600}
.pull .val{font-family:var(--display);font-weight:700;font-size:24px;min-width:28px;text-align:center;background:none;border:0;padding:0}
.pull .val.none{color:var(--muted)}

.finish{width:100%;border:0;border-radius:14px;background:var(--ink);color:var(--surface);padding:16px;font-size:17px;font-weight:600;margin-top:6px}
.finish.armed{background:var(--fail);color:#fff}

.result{background:var(--surface);border:2px solid var(--ok);border-radius:16px;padding:14px;margin-bottom:16px}
.result h3{margin:0 0 6px;font-family:var(--display);font-size:24px}
.result ul{margin:0;padding-left:18px}
.result button{margin-top:10px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:14px}

.timer{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);display:none;z-index:10}
.timer.on{display:block}
.timer-in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px}
.timer .t{font-family:var(--display);font-weight:700;font-size:38px;font-variant-numeric:tabular-nums;line-height:1}
.timer .lbl{flex:1;font-size:14px;opacity:.8}
.timer button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:6px 12px;font-size:14px}
.timer.ready{background:var(--ok);color:#fff}

.hist{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.hist-top{display:flex;justify-content:space-between;align-items:baseline}
.hist-top b{font-family:var(--display);font-size:22px}
.hist-top span{color:var(--muted);font-size:14px}
.hrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;font-size:14px;padding:4px 0;border-top:1px solid var(--line);align-items:baseline}
.hrow:first-of-type{border-top:0}
.hrow .w{font-variant-numeric:tabular-nums;font-weight:600}
.hrow .r{color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:1px}
.undo{margin-top:8px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px}
.emptystate{color:var(--muted);text-align:center;padding:40px 10px}

.setting{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 14px;margin-bottom:12px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow label{flex:1}
.srow .meta{display:block;font-size:13px;color:var(--muted)}
.srow input[type=number]{width:86px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:17px;text-align:right}
.srow input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.seg{display:flex;gap:4px}
.seg button{border:1px solid var(--line);background:transparent;border-radius:9px;padding:6px 14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.danger{width:100%;border:1px solid var(--fail);color:var(--fail);background:transparent;border-radius:12px;padding:12px;font-weight:600}
.danger.armed{background:var(--fail);color:#fff}
.sync{font-size:13px;color:var(--muted);text-align:center;margin:14px 0}
h4{font-size:14px;font-weight:600;color:var(--muted);margin:18px 4px 6px}
@media (prefers-reduced-motion:no-preference){.set{transition:background .12s,border-color .12s}}

.mini{display:flex;gap:4px}
.mini button{width:36px;height:36px;border:1px solid var(--line);background:transparent;border-radius:9px;font-size:16px}
.mini button:disabled{opacity:.3}
.srow .name{flex:1;min-width:0}
.srow input[type=text],.tname{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.tname{font-weight:600;font-size:17px;margin:4px 0}
select{width:100%;padding:9px 10px;border-radius:10px;border:1px dashed var(--line);background:transparent;color:var(--muted);font:inherit;font-size:15px}
.ghost{width:100%;border:1px dashed var(--line);background:transparent;border-radius:12px;padding:11px;font-weight:600;margin-bottom:12px}
.rowbtn{width:100%;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;padding:10px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.setting .rowbtn:first-child{border-top:0}
.chev{color:var(--accent);font-size:14px;font-weight:600}
.textbtn{border:0;background:transparent;color:var(--fail);font-weight:600;padding:4px 0;font-size:14px}
.textbtn.armed{text-decoration:underline}
.remind{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:14px;font-size:14px;color:var(--muted)}
.remind button,.small{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:500;white-space:nowrap}
.btnrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.err{color:var(--fail);font-size:14px;margin:6px 4px}
.ok-msg{color:var(--ok);font-size:14px;margin:6px 4px}
.note{font-size:13px;color:var(--muted);margin-top:2px}

</style>
</head>
<body>
<div class="wrap">
  <nav id="nav">
    <button data-tab="train">Trening</button>
    <button data-tab="hist">Historia</button>
    <button data-tab="set">Ustawienia</button>
  </nav>
  <main id="app"></main>
</div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<div class="timer" id="timer" role="status" aria-live="polite">
  <div class="timer-in"><span class="t" id="tt">3:00</span><span class="lbl" id="tl">Odpoczynek</span><button id="tskip">Zamknij</button></div>
</div>
<script>
(function(){
const KEY='sl5x5-state-v1', BKEY='sl5x5-backups', DAY=86400000;
const PLATES=[25,20,15,10,5,2.5,1.25,0.5];
const PSTYLE={25:['var(--p25)',58,13],20:['var(--p20)',58,12],15:['var(--p15)',50,11],10:['var(--p10)',42,10],5:['var(--p5)',32,8],2.5:['var(--p25)',26,6],1.25:['var(--steel)',22,5],0.5:['var(--steel)',18,4]};
const KINDS={weight:'Ciężar',reps:'Powtórzenia',check:'Odhaczanie'};
const KIND_HELP={weight:'Po udanym treningu aplikacja dokłada ciężar, a po 3 nieudanych z rzędu robi deload o 10%.',reps:'Wpisujesz liczbę powtórzeń w każdej serii, np. podciąganie.',check:'Odhaczasz zrobione serie, np. ćwiczenia dodatkowe.'};

const r2=x=>Math.round(x*100)/100;
const roundTo=(x,s)=>r2(Math.round(x/s)*s);
const fmt=x=>Number(x).toLocaleString('pl-PL',{maximumFractionDigits:2});
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);

function ex(o){return Object.assign({name:'Nowe ćwiczenie',kind:'weight',sets:5,reps:5,w:20,f:0,inc:2.5,microFrom:null,microInc:1,bar:20,lightFrom:null,note:''},o);}
function seed(){return{v:2,
  exercises:{
    squat:ex({name:'Przysiad',w:50,lightFrom:75}),
    bench:ex({name:'Wyciskanie leżąc',w:40,microFrom:60,microInc:1}),
    row:ex({name:'Wiosłowanie sztangą',w:40}),
    ohp:ex({name:'Wyciskanie nad głowę',w:30,microFrom:42.5,microInc:1}),
    dead:ex({name:'Martwy ciąg',sets:1,w:70,inc:5,microFrom:100,microInc:2.5}),
    pullo:ex({name:'Podciąganie nachwytem',kind:'reps',sets:3,note:'3 serie, max'}),
    pullu:ex({name:'Podciąganie podchwytem',kind:'reps',sets:3,note:'3 serie, max'}),
    face:ex({name:'Face pulls',kind:'check',sets:3,note:'3 serie po 15, lekko'}),
    core:ex({name:'Plank lub ab wheel',kind:'check',sets:3,note:'3 serie'})
  },
  workouts:[{id:'A',name:'Trening A',items:['squat','bench','row','pullo','face']},{id:'B',name:'Trening B',items:['squat','ohp','dead','pullu','core']}],
  next:0,rest:{ok:180,fail:300},session:null,history:[],lastExport:0,updatedAt:0};}

/* ---------- migration from version 1 ---------- */
const V1N={squat:'Przysiad',bench:'Wyciskanie leżąc',row:'Wiosłowanie sztangą',ohp:'Wyciskanie nad głowę',dead:'Martwy ciąg'};
function migrate(raw){
  if(!raw||typeof raw!=='object')return seed();
  if(raw.v===2&&raw.exercises&&raw.workouts){const s=Object.assign(seed(),raw);if(!s.rest)s.rest={ok:180,fail:300};return s;}
  const s=seed(),L=raw.lifts||{};
  Object.keys(V1N).forEach(k=>{if(L[k]&&isFinite(L[k].w)){s.exercises[k].w=L[k].w;s.exercises[k].f=L[k].f||0;}});
  if(raw.lightWed===false)s.exercises.squat.lightFrom=null;
  if(raw.rest)s.rest=raw.rest;
  s.next=raw.next==='B'?1:0;
  s.updatedAt=raw.updatedAt||0;
  s.history=(raw.history||[]).map(e=>{
    const items=[];
    Object.keys(e.lifts||{}).forEach(k=>items.push({id:k,name:V1N[k]||k,kind:'weight',w:e.lifts[k].w,vals:e.lifts[k].reps||[],light:k==='squat'&&!!e.light}));
    const pid=e.type==='B'?'pullu':'pullo';
    if(e.pull&&e.pull.some(v=>v!==null))items.push({id:pid,name:s.exercises[pid].name,kind:'reps',vals:e.pull});
    const prev={};Object.keys(e.prev||{}).forEach(k=>prev[k]={w:e.prev[k].w,f:e.prev[k].f||0});
    return{date:e.date,wid:e.type,name:'Trening '+e.type,items,prev,notes:e.notes||[]};
  });
  if(raw.session&&raw.session.sets){
    const ss=raw.session,idx=ss.type==='B'?1:0,ns=newSession(idx,s);
    ns.started=ss.started||Date.now();
    ns.items.forEach(it=>{
      if(ss.sets[it.id]){it.vals=ss.sets[it.id].slice();if(ss.w&&ss.w[it.id]!==undefined)it.w=ss.w[it.id];if(it.id==='squat')it.light=!!ss.light;}
      else if(it.kind==='reps'&&ss.pull)it.vals=ss.pull.slice(0,it.sets);
      else if(it.kind==='check'&&ss.acc)it.vals=ss.acc.slice(0,it.sets);
    });
    s.session=ns;
  }
  return s;
}

/* ---------- backups ---------- */
function readBackups(){try{return JSON.parse(localStorage.getItem(BKEY)||'[]');}catch(e){return[];}}
function snapshot(reason,data){
  let arr=readBackups();arr.unshift({t:Date.now(),reason,data:data||clone(state)});
  for(let n=10;n>=1;n--){arr=arr.slice(0,n);try{localStorage.setItem(BKEY,JSON.stringify(arr));return;}catch(e){}}
}

/* ---------- load ---------- */
let state;
try{
  const s=localStorage.getItem(KEY);
  if(s){const raw=JSON.parse(s);if(raw.v!==2)snapshot('Przed aktualizacją aplikacji',raw);state=migrate(raw);}
  else state=seed();
}catch(e){state=seed();}
try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}

let tab='train',lastResult=null,armed='',syncMode='local',editId=null,editAddTo=null,draft=null,msg='',msgOk=true;

/* ---------- persistence ---------- */
let dbRef=null,writing=false,pending=false,debounce=null;
function persist(){
  state.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
  if(dbRef){clearTimeout(debounce);debounce=setTimeout(flush,700);}
}
async function flush(){
  if(!dbRef)return;
  if(writing){pending=true;return;}
  writing=true;
  try{await dbRef.set(clone(state));}catch(e){if(e&&(e.code==='invalid_argument'||e.code==='revoked')){dbRef=null;syncMode='local';}}
  writing=false;
  if(pending){pending=false;flush();}
}
(async function initDb(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    const ref=db.doc('data/users/'+id+'/stronglifts');
    const snap=await ref.get();
    dbRef=ref;syncMode='cloud';
    if(snap.exists){const remote=snap.data();if((remote.updatedAt||0)>(state.updatedAt||0)){state=migrate(clone(remote));try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}render();return;}}
    if(state.updatedAt)flush();
    render();
  }catch(e){}
})();

/* ---------- logic ---------- */
function incFor(E){return(E.microFrom!=null&&E.w>=E.microFrom)?E.microInc:E.inc;}
function lightW(E){return Math.max(E.bar||0,roundTo(E.w*0.85,2.5));}
function newSession(idx,st){
  st=st||state;
  if(!(idx>=0&&idx<st.workouts.length))idx=0;
  const W=st.workouts[idx],wed=new Date().getDay()===3;
  const items=W.items.filter(id=>st.exercises[id]).map(id=>{
    const E=st.exercises[id];
    const light=E.kind==='weight'&&E.lightFrom!=null&&wed&&E.w>=E.lightFrom;
    return{id,name:E.name,kind:E.kind,sets:E.sets,reps:E.reps,note:E.note,bar:E.bar,w:light?lightW(E):E.w,light,vals:Array(E.sets).fill(E.kind==='check'?false:null)};
  });
  return{wid:W.id,name:W.name,started:Date.now(),items};
}
function curIdx(){const s=state.session;return s?state.workouts.findIndex(w=>w.id===s.wid):-1;}
function ensureSession(){
  if(!state.session||curIdx()<0){state.session=newSession(state.next);persist();}
}
function touched(s){return s.items.some(it=>it.vals.some(v=>v!==null&&v!==false));}
function complete(s){return s.items.filter(it=>it.kind==='weight').every(it=>it.vals.every(v=>v!==null));}
function refreshUntouched(){if(state.session&&!touched(state.session))state.session=null;}

function warmups(it){
  const W=it.w,out=[];
  if(!it.bar)return out;
  if(it.id==='dead'){[[0.5,5],[0.7,3],[0.85,2]].forEach(([p,r])=>{const w=roundTo(W*p,2.5);if(w>=40&&w<W)out.push([w,r]);});}
  else{
    if(W<=it.bar)return out;
    out.push([it.bar,5],[it.bar,5]);
    [[0.5,5],[0.7,3],[0.85,2]].forEach(([p,r])=>{const w=roundTo(W*p,2.5);if(w>it.bar&&w<W)out.push([w,r]);});
  }
  return out.filter((x,i,a)=>i===0||x[0]!==a[i-1][0]||x[0]===it.bar);
}
function plates(W,bar){
  let side=r2((W-bar)/2);const out=[];
  if(side<=0)return{out,rest:0};
  for(const p of PLATES){while(side>=p-1e-9){out.push(p);side=r2(side-p);}}
  return{out,rest:side};
}

function finish(){
  const s=state.session;if(!s)return;
  const prev={},items=[],notes=[];
  s.items.forEach(it=>{if(it.kind==='weight'&&state.exercises[it.id]){const E=state.exercises[it.id];prev[it.id]={w:E.w,f:E.f};}});
  s.items.forEach(it=>{
    if(it.kind==='weight'){
      if(it.vals.every(v=>v===null))return;
      items.push({id:it.id,name:it.name,kind:'weight',w:it.w,vals:it.vals.slice(),light:it.light});
      const E=state.exercises[it.id];if(!E||E.kind!=='weight')return;
      if(it.light){notes.push(it.name+': lżejszy dzień, ciężar bez zmian ('+fmt(E.w)+' kg).');return;}
      if(it.vals.every(v=>v!==null&&v>=it.reps)){E.w=r2(E.w+incFor(E));E.f=0;notes.push(it.name+': następnym razem '+fmt(E.w)+' kg.');}
      else{
        E.f=(E.f||0)+1;
        if(E.f>=3){E.w=Math.max(E.bar||0,roundTo(E.w*0.9,2.5));E.f=0;notes.push(it.name+': trzecie nieudane podejście, deload do '+fmt(E.w)+' kg.');}
        else notes.push(it.name+': nieudane podejście '+E.f+' z 3, zostajesz na '+fmt(E.w)+' kg.');
      }
    }else if(it.kind==='reps'){
      if(it.vals.some(v=>v!==null))items.push({id:it.id,name:it.name,kind:'reps',vals:it.vals.slice()});
    }else{
      const n=it.vals.filter(Boolean).length;if(n)items.push({id:it.id,name:it.name,kind:'check',done:n,sets:it.sets});
    }
  });
  if(!items.length){armed='';render();return;}
  state.history.unshift({date:Date.now(),wid:s.wid,name:s.name,items,prev,notes});
  if(state.history.length>300)state.history.length=300;
  const idx=curIdx();
  state.next=((idx>=0?idx:0)+1)%state.workouts.length;
  state.session=null;
  lastResult=notes.length?notes:['Zapisano.'];
  armed='';stopTimer();
  persist();
  snapshot('Po treningu');
  window.scrollTo({top:0});
}
function undoLast(){
  const e=state.history[0];if(!e)return;
  snapshot('Przed cofnięciem treningu');
  Object.keys(e.prev||{}).forEach(id=>{const E=state.exercises[id];if(E){E.w=e.prev[id].w;E.f=e.prev[id].f;}});
  const idx=state.workouts.findIndex(w=>w.id===e.wid);if(idx>=0)state.next=idx;
  state.history.shift();state.session=null;lastResult=null;
  persist();render();
}

async function exportBackup(){
  const name='5x5-kopia-'+new Date().toISOString().slice(0,10)+'.json';
  const file=new File([JSON.stringify(state)],name,{type:'application/json'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});markExported();return;}
  }catch(e){if(e&&e.name==='AbortError')return;}
  try{
    const url=URL.createObjectURL(file),a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),3000);markExported();
  }catch(e){msg='Nie udało się zapisać pliku.';msgOk=false;render();}
}
function markExported(){state.lastExport=Date.now();persist();msg='Kopia zapisana.';msgOk=true;render();}
document.getElementById('importFile').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  try{
    const raw=JSON.parse(await f.text());
    if(!raw||!((raw.v===2&&raw.exercises&&raw.workouts)||raw.lifts))throw new Error('format');
    snapshot('Przed wczytaniem kopii');
    state=migrate(raw);state.session=null;persist();
    msg='Kopia wczytana: '+state.history.length+' treningów w historii.';msgOk=true;
  }catch(err){msg='To nie jest plik kopii z tej aplikacji.';msgOk=false;}
  render();
});

let timerEnd=0,timerIv=null,beeped=false,actx=null;
const $t=document.getElementById('timer'),$tt=document.getElementById('tt'),$tl=document.getElementById('tl');
function unlockAudio(){try{if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(C)actx=new C();}if(actx&&actx.state==='suspended')actx.resume();}catch(e){}}
function beep(){try{if(actx){[0,0.25].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(0.2,actx.currentTime+d);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+d+0.18);o.start(actx.currentTime+d);o.stop(actx.currentTime+d+0.2);});}if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}}
function startTimer(sec,label){timerEnd=Date.now()+sec*1000;beeped=false;$tl.textContent=label;$t.classList.add('on');$t.classList.remove('ready');tick();clearInterval(timerIv);timerIv=setInterval(tick,250);}
function stopTimer(){clearInterval(timerIv);timerIv=null;$t.classList.remove('on','ready');}
function tick(){
  const left=Math.ceil((timerEnd-Date.now())/1000);
  if(left<=0){$tt.textContent='0:00';$tl.textContent='Czas na kolejną serię';$t.classList.add('ready');if(!beeped){beeped=true;beep();}return;}
  $tt.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
}

  if(editAddTo!=null&&state.workouts[editAddTo]&&!state.workouts[editAddTo].items.includes(editId))state.workouts[editAddTo].items.push(editId);
  refreshUntouched();persist();
  tab='set';editId=null;draft=null;msg='Zapisano: '+name+'.';msgOk=true;render();
}

/* ---------- events ---------- */
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.tab;armed='';render();window.scrollTo({top:0});});
$app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  unlockAudio();
  const a=b.dataset.a,s=state.session,n=+b.dataset.n,i=+b.dataset.i,wi=+b.dataset.w;
  const wasArmed=armed;armed='';
  const it=s&&s.items[n];
  if(a==='set'){const v=it.vals[i],nv=v===null?it.reps:(v===0?null:v-1);it.vals[i]=nv;
    if(nv===it.reps)startTimer(state.rest.ok,'Odpoczynek');else if(nv!==null)startTimer(state.rest.fail,'Dłuższy odpoczynek');else stopTimer();
    persist();render();return;}
  if(a==='pv'){if(it.vals[i]===null){const prev=state.history.map(h=>(h.items||[]).find(x=>x.id===it.id&&x.kind==='reps')).find(x=>x&&x.vals[i]!=null);it.vals[i]=prev?prev.vals[i]:5;startTimer(120,'Odpoczynek');}persist();render();return;}
  if(a==='pp'){it.vals[i]=(it.vals[i]===null?0:it.vals[i])+1;persist();render();return;}
  if(a==='pm'){if(it.vals[i]!==null)it.vals[i]=it.vals[i]<=0?null:it.vals[i]-1;persist();render();return;}
  if(a==='acc'){it.vals[i]=!it.vals[i];if(it.vals[i])startTimer(75,'Odpoczynek');persist();render();return;}
  if(a==='light'){const E=state.exercises[it.id];if(E){it.light=!it.light;it.w=it.light?lightW(E):E.w;}persist();render();return;}
  if(a==='swap'){state.session=newSession((curIdx()+1)%state.workouts.length);persist();render();return;}
  if(a==='finish'){if(complete(s)||wasArmed==='finish')finish();else armed='finish';render();return;}
  if(a==='dismiss'){lastResult=null;render();return;}
  if(a==='export'){exportBackup();return;}
  if(a==='import'){document.getElementById('importFile').click();return;}
  if(a==='undo'){if(wasArmed==='undo')undoLast();else{armed='undo';render();}return;}
  if(a==='next'){state.next=+b.dataset.v;refreshUntouched();persist();render();return;}
  if(a==='up'||a==='down'){const L=state.workouts[wi].items,j=a==='up'?i-1:i+1;if(j>=0&&j<L.length){[L[i],L[j]]=[L[j],L[i]];refreshUntouched();persist();}render();return;}
  if(a==='rm'){state.workouts[wi].items.splice(i,1);refreshUntouched();persist();render();return;}
  if(a==='addw'){const L=state.workouts.length;state.workouts.push({id:uid('w'),name:'Trening '+String.fromCharCode(65+Math.min(L,25)),items:[]});persist();render();return;}
  if(a==='delw'){if(wasArmed!=='delw'+wi){armed='delw'+wi;render();return;}
    snapshot('Przed usunięciem treningu');const W=state.workouts.splice(wi,1)[0];
    if(state.session&&state.session.wid===W.id)state.session=null;
    if(state.next>=state.workouts.length)state.next=0;persist();render();return;}
  if(a==='edit'){openEdit(b.dataset.id,null);return;}
  if(a==='newex'){openEdit(uid('e'),null);return;}
  if(a==='kind'){draft.kind=b.dataset.v;render();return;}
  if(a==='save'){saveEdit();return;}
  if(a==='cancel'){tab='set';draft=null;render();return;}
  if(a==='delex'){if(wasArmed!=='delex'){armed='delex';render();return;}
    snapshot('Przed usunięciem ćwiczenia');const nm=state.exercises[editId].name;delete state.exercises[editId];
    state.workouts.forEach(W=>W.items=W.items.filter(x=>x!==editId));
    refreshUntouched();persist();tab='set';draft=null;msg='Usunięto: '+nm+'. Historia zostaje.';msgOk=true;render();return;}
  if(a==='restore'){if(wasArmed!=='restore'+i){armed='restore'+i;render();return;}
    const bk=readBackups()[i];if(!bk)return;const data=clone(bk.data);snapshot('Przed przywróceniem kopii');
    state=migrate(data);state.session=null;persist();msg='Przywrócono kopię.';msgOk=true;render();return;}
  if(a==='reset'){if(wasArmed!=='reset'){armed='reset';render();return;}
    snapshot('Przed wyczyszczeniem danych');state=seed();lastResult=null;stopTimer();persist();tab='train';render();return;}
  render();
});
$app.addEventListener('input',e=>{const t=e.target;if(t.dataset.f&&draft)draft[t.dataset.f]=t.value;});
$app.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.wname!==undefined){const W=state.workouts[+t.dataset.wname],v=t.value.trim();if(W&&v){W.name=v;if(state.session&&state.session.wid===W.id)state.session.name=v;persist();}render();return;}
  if(t.dataset.addto!==undefined){const wi=+t.dataset.addto,v=t.value;if(!v)return;
    if(v==='__new'){openEdit(uid('e'),wi);return;}
    const W=state.workouts[wi];if(W&&!W.items.includes(v)){W.items.push(v);refreshUntouched();persist();}render();return;}
  if(t.dataset.r){const v=parseInt(t.value,10);if(v>=10&&v<=900){state.rest[t.dataset.r]=v;persist();}render();}
});
render();
})();
</script>
</body>
</html>
